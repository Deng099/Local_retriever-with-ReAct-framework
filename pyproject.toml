[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-react-rag"
version = "0.1.0"
description = "A small research framework for ReAct with local dense retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
retrieval = [
    "fastapi>=0.115,<1",
    "faiss-cpu>=1.9,<2",
    "numpy>=2,<3",
    "trafilatura>=2,<3",
    "uvicorn>=0.30,<1",
]
python-tool = [
    "numpy>=2,<3",
    "pandas>=2,<4",
    "scipy>=1.14,<2",
]
server = [
    "fastapi>=0.115,<1",
    "faiss-cpu>=1.9,<2",
    "numpy>=2,<3",
    "pandas>=2,<4",
    "scipy>=1.14,<2",
    "torch>=2.7,<3",
    "trafilatura>=2,<3",
    "transformers>=4.55,<5",
    "uvicorn>=0.30,<1",
]
indexing = [
    "faiss-cpu>=1.9,<2",
    "numpy>=2,<3",
    "torch>=2.7,<3",
    "transformers>=4.55,<5",
]
benchmark-prep = [
    "huggingface-hub>=0.34,<1",
    "pyarrow>=19,<23",
]

[project.scripts]
react-rag = "my_ReAct.run:main"
react-rag-retrieval = "local_retrieval.retrieval_service:main"
react-rag-retrieval-eval = "local_retrieval.retrieval_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_ReAct*", "local_retrieval*"]
